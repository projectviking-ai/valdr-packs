name: Release Valdr Workflow Pack

on:
  workflow_dispatch:
  push:
    tags:
      - valdr-workflow-v*

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read CLI and pack versions
        id: versions
        run: |
          CLI_VERSION="$(tr -d '\n' < VALDR_WORKFLOW_CLI_VERSION)"
          PACK_VERSION="$(awk '
            /^version: / {
              count += 1
              version = $2
            }
            END {
              if (count != 1 || version == "") exit 1
              print version
            }
          ' valdr-packs/valdr-workflow/pack.yaml)"
          if [ -z "$CLI_VERSION" ] || [ -z "$PACK_VERSION" ]; then
            echo "CLI and pack versions must be nonempty." >&2
            exit 1
          fi
          RELEASE_TAG="valdr-workflow-v${PACK_VERSION}"
          printf '%s\n' "cli=${CLI_VERSION}" "pack=${PACK_VERSION}" "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Verify release tag
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ steps.versions.outputs.tag }}
        run: |
          if [ "$GITHUB_REF_NAME" != "$RELEASE_TAG" ]; then
            echo "Expected tag $RELEASE_TAG, got $GITHUB_REF_NAME." >&2
            exit 1
          fi

      - name: Fail if release exists
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if response="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" --include --silent 2>/dev/null)"; then
            gh_status=0
          else
            gh_status=$?
          fi
          status="$(printf '%s\n' "$response" | awk '/^HTTP\// { status = $2 } END { print status }')"
          case "$status" in
            200) echo "Release $GITHUB_REF_NAME already exists." >&2; exit 1 ;;
            404) ;;
            *) echo "Could not determine whether release $GITHUB_REF_NAME exists (gh exit $gh_status, HTTP ${status:-none})." >&2; exit 1 ;;
          esac

      - name: Download pinned Valdr CLI
        env:
          CLI_VERSION: ${{ steps.versions.outputs.cli }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-cli
          cd release-cli
          gh release download "v${CLI_VERSION}" --repo projectviking-ai/valdr-releases \
            --pattern "valdr-v${CLI_VERSION}-macos-arm64.tar.gz" \
            --pattern "valdr-v${CLI_VERSION}-macos-arm64.tar.gz.sha256"

      - name: Verify and extract pinned Valdr CLI
        id: valdr
        env:
          CLI_VERSION: ${{ steps.versions.outputs.cli }}
        run: |
          cd release-cli
          shasum -a 256 -c "valdr-v${CLI_VERSION}-macos-arm64.tar.gz.sha256"
          tar -xzf "valdr-v${CLI_VERSION}-macos-arm64.tar.gz"
          actual_version="$(bin/valdr version | awk 'NR == 1 { print $2 }')"
          if [ -z "$actual_version" ] || [ "$actual_version" != "$CLI_VERSION" ]; then
            echo "Expected Valdr CLI ${CLI_VERSION}, got: $actual_version" >&2
            exit 1
          fi
          echo "path=$(pwd)/bin/valdr" >> "$GITHUB_OUTPUT"

      - name: Build Valdr Workflow Pack
        env:
          VALDR_BIN: ${{ steps.valdr.outputs.path }}
        run: VALDR_BIN="$VALDR_BIN" make build-valdr-workflow

      - name: Upload Valdr Workflow Pack
        uses: actions/upload-artifact@v4
        with:
          name: valdr-workflow-pack
          path: build/valdr-workflow.valdr-pack.tar.gz
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          PACK_VERSION: ${{ steps.versions.outputs.pack }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/valdr-workflow.valdr-pack.tar.gz \
            --target "$GITHUB_SHA" \
            --title "Valdr Workflow Pack ${PACK_VERSION}" \
            --notes "Valdr workflow pack release ${PACK_VERSION}"
