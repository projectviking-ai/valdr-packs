schemaVersion: 1.0
agent:
  handle: verdandi
  name: Verdandi Workflow Orchestrator
  kind: bot
  defaultRole: orchestrator
  tags:
    - valdr-workflow
    - workflow
    - orchestrator
    - authoring
    - debugging
capabilities:
  - key: valdr-workflow.verdandi.system
    role: core

  # Always loaded: workflow hazards and MCP access rules are required on every
  # turn, including before Verdandi chooses which detailed guidance to load.
  - key: valdr-workflow.verdandi.hazards
    role: constraints
  - key: valdr-workflow.base.mcp-access
    role: constraints

  # Hot-load: large references pulled in when the task calls for them.
  - key: valdr-workflow.verdandi.authoring
    role: workflow
    hot-load: true
  - key: valdr-workflow.steps.human-gate
    role: workflow
    hot-load: true
  - key: valdr-workflow.verdandi.operating
    role: workflow
    hot-load: true
  - key: valdr-workflow.verdandi.debugging
    role: workflow
    hot-load: true
  - key: valdr-workflow.verdandi.user-tools
    role: workflow
    hot-load: true

  # Shared workflow execution references; load only the selected tool family.
  - key: valdr-workflow.tools.overview
    role: integration
    hot-load: true
  - key: valdr-workflow.tools.valdr
    role: integration
    hot-load: true
  - key: valdr-workflow.tools.command
    role: integration
    hot-load: true
  - key: valdr-workflow.tools.git
    role: integration
    hot-load: true
  - key: valdr-workflow.tools.github
    role: integration
    hot-load: true
  - key: valdr-workflow.tools.user-tools
    role: integration
    hot-load: true

  - key: valdr.core.tools.pm-user-tool
    role: integration
    hot-load: true
  - key: valdr.core.tools.pm-workflow
    role: integration
    hot-load: true
  - key: valdr.core.tools.pm-task
    role: integration
    hot-load: true
  - key: valdr.core.tools.pm-session
    role: integration
    hot-load: true
  - key: valdr.core.tools.pm-review
    role: integration
    hot-load: true
  - key: valdr.core.tools.pm-audit
    role: integration
    hot-load: true
  - key: valdr.core.tools.pm-agent
    role: integration
    hot-load: true
  - key: valdr.core.tools.pm-provider
    role: integration
    hot-load: true
  - key: valdr.core.tools.pm-health
    role: integration
    hot-load: true
  - key: valdr.core.tools.pm-capability
    role: integration
    hot-load: true
  - key: valdr.core.tools.pm-project
    role: integration
    hot-load: true
  - key: valdr.core.tools.pm-sprint
    role: integration
    hot-load: true
  - key: valdr.core.tools.vmp
    role: integration
    hot-load: true
  - key: valdr.core.tools.pm-prompt
    role: integration
    hot-load: true
  - key: valdr.core.tools.pm-knowledge
    role: integration
    hot-load: true
