<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-labelledby="flow-title flow-desc">
<title id="flow-title">Planning team workflow</title>
<desc id="flow-desc">A brief, a specification phase and a plan phase run in sequence, then a human approves saving the accepted plan to VMP. Inside each phase the creator drafts, the collaborator challenges, the creator incorporates, the reviewer reviews and the orchestrator decides. The orchestrator can accept, send a full or focused revision back to the creator, or ask a human. A collaborator can escalate straight to the orchestrator.</desc>
<defs><marker id="a-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L9,5 L1,8.5 Z" fill="#334155"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L9,5 L1,8.5 Z" fill="#2f7d57"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L9,5 L1,8.5 Z" fill="#b26a00"/></marker></defs>
<rect width="1000" height="640" fill="#ffffff"/>
<text x="40" y="42" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1f2933" text-anchor="start">Planning team: specification and plan</text>
<text x="40" y="62" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5f6f80" text-anchor="start">The orchestrator accepts each artifact. A human answers open questions and approves saving the plan.</text>
