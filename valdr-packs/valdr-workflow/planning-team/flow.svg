<text x="40" y="608" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f6f80" text-anchor="start">Seven sessions share one worktree and are reused across passes. Providers and models come from the four preset inputs.</text>
