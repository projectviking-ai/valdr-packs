schemaVersion: 1
workflow:
  key: valdr-workflow.task.rereview
  name: Reuse Task Reviewer
  description: Reset one existing assignment, reuse its reviewer session, and wait for that turn's fresh published decision.
  version: 0.1.0
  pack: valdr-workflow
  source: { kind: capability, capabilityKey: valdr-workflow.workflow.task-rereview }
  start: { mode: manual }
  inputs:
    taskKey: { type: string, required: true }
    sourceSessionUlid: { type: string, required: true }
    reviewId: { type: string, required: true }
    reviewer: { type: object, required: true }
  outputs:
    outcome: { type: string, required: true }
    reviewerSessionUlid: { type: string, required: true }
  outputMappings:
    outcome: "${steps.review.outputs.outcome}"
    reviewerSessionUlid: "${workflow.inputs.reviewer.sessionUlid}"
  steps:
    - key: reset
      name: Reset the existing assignment
      kind: tool
      tool: { id: pm_review, action: update_assignment }
      inputs:
        reviewId: "${workflow.inputs.reviewId}"
        assignmentId: "${workflow.inputs.reviewer.assignmentId}"
        status: pending
        actorHandle: "${runtime.actor}"
    - key: review
      name: Review in the same session
      kind: session
      needs: [reset]
      session:
        action: input
        sessionUlid: "${workflow.inputs.reviewer.sessionUlid}"
        expectAgentHandle: "${workflow.inputs.reviewer.reviewerHandle}"
        expectTaskKey: "${workflow.inputs.taskKey}"
        reviewPublication:
          taskKey: "${workflow.inputs.taskKey}"
          reviewId: "${workflow.inputs.reviewId}"
          assignmentId: "${workflow.inputs.reviewer.assignmentId}"
          sourceSessionUlid: "${workflow.inputs.sourceSessionUlid}"
        prompt: |-
          Review the current changes for task ${workflow.inputs.taskKey} in the existing implementation worktree.
          Use reviewId ${workflow.inputs.reviewId} and assignmentId ${workflow.inputs.reviewer.assignmentId}.
          Publish exactly one fresh PM review decision on this revision, with a numeric score and concise findings.
          Do not send a message or pm_session input to the implementation session, request another review,
          launch sessions, change task status, edit files, commit, or push. This workflow owns coordination
          and will send any requested changes to the existing implementation session.
          Finish after publishing your decision; do not wait for the implementer.
      waitsFor:
        kind: workflow_input
        expected: [review_approved, review_changes_requested]
      outputs:
        outcome: $.normalized.input.outcome
