schemaVersion: 1
workflow:
  key: valdr-workflow.pull-request.decide
  name: Decide Pull Request Action
  description: "Check PR state first, then choose a best-effort action from session activity and the checkpoint."
  version: 0.1.5
  pack: valdr-workflow
  source:
    kind: capability
    capabilityKey: valdr-workflow.workflow.pull-request-decide
  start:
    mode: manual
  inputs:
    owner:
      type: string
      required: true
    repo:
      type: string
      required: true
    roundStatus:
      type: string
      required: true
    hasActive:
      type: string
      required: true
    prNumber:
      type: integer
      required: true
    state:
      type: object
      required: true
  outputs:
    decision:
      type: string
      required: true
    cancelRound:
      type: string
      required: true
    prOutcome:
      type: string
      required: true
    notice:
      type: string
      required: true
    noticeTarget:
      type: string
      required: true
    requestId:
      type: string
      required: true
    nextState:
      type: object
      required: true
  outputMappings:
    decision: "${steps.snapshot.outputs.decision}"
    cancelRound: "${steps.snapshot.outputs.cancelRound}"
    prOutcome: "${steps.snapshot.outputs.prOutcome}"
    notice: "${steps.snapshot.outputs.notice}"
    noticeTarget: "${steps.snapshot.outputs.noticeTarget}"
    requestId: "${steps.snapshot.outputs.requestId}"
    nextState: "${steps.snapshot.outputs.nextState}"
  steps:
    - key: request_id
      name: Generate request id
      kind: tool
      tool:
        id: pm_generate_ulid
        action: call
      inputs: {}
      outputs:
        ulid: $.raw.ulid
      onFailure:
        action: fail
    - key: snapshot
      name: Snapshot the pull request
      kind: tool
      tool:
        id: valdr-workflow.user.pr-feedback
        action: snapshot
        revision: 1.2.1
        contentHash: sha256:a0bbaf0ae533ca632dd2b371977ac922b9d187bd12688ab9167bd4409e72e2a1
        inputSchema:
          type: object
          properties:
            owner:
              type: string
              pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{0,38}$"
            repo:
              type: string
              pattern: "^[A-Za-z0-9._-]{1,100}$"
            number:
              type: integer
              minimum: 1
              maximum: 9007199254740991
            state:
              $ref: "#/$defs/state"
            roundStatus:
              enum:
                - ""
                - pending
                - running
                - waiting
                - blocked
                - failed
                - completed
                - cancelled
                - ready_review
                - ready_revise
                - ready_publish
            freshRequestId:
              type: string
              minLength: 1
              maxLength: 128
              pattern: \S
            hasActive:
              enum:
                - "yes"
                - "no"
          required:
            - owner
            - repo
            - number
            - state
            - freshRequestId
          additionalProperties: false
          $defs:
            state:
              type: object
              properties:
                v:
                  const: 1
                handled:
                  type: array
                  items:
                    type: string
                floor:
                  type:
                    - string
                    - "null"
                checkFix:
                  type: object
                  properties:
                    lastSha:
                      type:
                        - string
                        - "null"
                    attempts:
                      type: integer
                      minimum: 0
                  required:
                    - lastSha
                    - attempts
                  additionalProperties: false
                inFlight:
                  oneOf:
                    - type: "null"
                    - $ref: "#/$defs/inFlight"
                hold:
                  oneOf:
                    - type: "null"
                    - $ref: "#/$defs/hold"
                notices:
                  type: integer
                  minimum: 0
                questions:
                  type: array
                  maxItems: 10
                  items:
                    $ref: "#/$defs/question"
              required:
                - v
                - handled
                - floor
                - checkFix
                - inFlight
                - hold
              additionalProperties: false
            inFlight:
              type: object
              properties:
                requestId:
                  type: string
                runUlid:
                  type: string
                itemIds:
                  type: array
                  items:
                    type: string
                headSha:
                  type: string
                checkFix:
                  type: boolean
                failureReported:
                  type: boolean
                dispatchedAt:
                  type: string
                sessionProgress:
                  type: object
                  properties:
                    cursor:
                      type: integer
                      minimum: 0
                    promptSeq:
                      type:
                        - integer
                        - "null"
                      minimum: 0
                    startSeq:
                      type:
                        - integer
                        - "null"
                      minimum: 0
                    finalSeq:
                      type:
                        - integer
                        - "null"
                      minimum: 0
                    finalText:
                      type: string
                      maxLength: 8192
                    terminalStatus:
                      enum:
                        - pending
                        - completed
                        - failed
                  required:
                    - cursor
                    - promptSeq
                    - startSeq
                    - finalSeq
                    - finalText
                  additionalProperties: false
                questions:
                  type: array
                  maxItems: 10
                  items:
                    $ref: "#/$defs/question"
                coordination:
                  type: object
                  properties:
                    phase:
                      enum:
                        - implementing
                        - reviewing
                        - publishing
                        - published
                        - blocked
                    stageAt:
                      type: string
                    pass:
                      type: integer
                      minimum: 1
                      maximum: 3
                    reviewId:
                      type: string
                    reviewers:
                      type: array
                      minItems: 1
                      maxItems: 50
                      items:
                        type: object
                        properties:
                          sessionUlid:
                            type: string
                          assignmentId:
                            type: string
                          reviewerHandle:
                            type: string
                        required:
                          - sessionUlid
                          - assignmentId
                          - reviewerHandle
                        additionalProperties: false
                    snapshot:
                      type: object
                    result:
                      type: object
                      properties:
                        status:
                          enum:
                            - implemented
                            - blocked
                        replies:
                          type: array
                          maxItems: 50
                          items:
                            type: object
                            properties:
                              itemId:
                                type: string
                              body:
                                type: string
                              target:
                                type: string
                            required:
                              - itemId
                              - body
                            additionalProperties: false
                      required:
                        - status
                        - replies
                      additionalProperties: false
                  required:
                    - phase
                    - stageAt
                    - pass
                    - reviewId
                    - reviewers
                  additionalProperties: false
              required:
                - requestId
                - itemIds
                - headSha
                - checkFix
                - failureReported
              additionalProperties: false
            hold:
              type: object
              properties:
                reason:
                  type: string
                sinceHeadSha:
                  type: string
                since:
                  type: string
              required:
                - reason
                - sinceHeadSha
              additionalProperties: false
            question:
              type: object
              properties:
                body:
                  type: string
                  minLength: 1
                  maxLength: 1000
                  pattern: \S
                url:
                  type: string
                  pattern: "^https://[^\\s]+$"
                  maxLength: 2048
                createdAt:
                  type: string
                headSha:
                  type: string
                  pattern: "^[0-9a-f]{40}$"
                itemIds:
                  type: array
                  maxItems: 50
                  items:
                    type: string
                    pattern: "^(ic|rv|rc):(0|[1-9][0-9]{0,19})$"
                answerAuthors:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: string
                    minLength: 1
                    maxLength: 100
                    pattern: \S
                checkFix:
                  type: boolean
                threadRootId:
                  type: string
                  pattern: "^rc:(0|[1-9][0-9]{0,19})$"
              required:
                - body
                - url
                - createdAt
                - headSha
                - itemIds
                - answerAuthors
                - checkFix
              additionalProperties: false
        outputSchema:
          type: object
          properties:
            decision:
              type: string
              enum:
                - idle
                - closed
                - complete
                - save
                - report_failure
                - dispatch
                - review
                - revise
                - publish
            cancelRound:
              type: string
              enum:
                - "yes"
                - "no"
            prOutcome:
              enum:
                - merged
                - closed
                - open
            nextState:
              $ref: "#/$defs/state"
            notice:
              type: string
            noticeTarget:
              type: string
              pattern: "^(notice:[0-9]+)?$"
            requestId:
              type: string
            headSha:
              type: string
            prState:
              enum:
                - open
                - closed
            itemCount:
              type: integer
              minimum: 0
            mergeEvidence:
              oneOf:
                - type: "null"
                - type: object
                  properties:
                    repository:
                      type: string
                    baseBranch:
                      type: string
                    headBranch:
                      type: string
                    headSha:
                      type: string
                    mergeCommitSha:
                      type: string
                    mergedAt:
                      type: string
                  required:
                    - repository
                    - baseBranch
                    - headBranch
                    - headSha
                    - mergeCommitSha
                    - mergedAt
                  additionalProperties: false
          required:
            - decision
            - cancelRound
            - prOutcome
            - nextState
            - notice
            - noticeTarget
            - requestId
            - headSha
            - prState
            - itemCount
            - mergeEvidence
          additionalProperties: false
          $defs:
            state:
              type: object
              properties:
                v:
                  const: 1
                handled:
                  type: array
                  items:
                    type: string
                floor:
                  type:
                    - string
                    - "null"
                checkFix:
                  type: object
                  properties:
                    lastSha:
                      type:
                        - string
                        - "null"
                    attempts:
                      type: integer
                      minimum: 0
                  required:
                    - lastSha
                    - attempts
                  additionalProperties: false
                inFlight:
                  oneOf:
                    - type: "null"
                    - $ref: "#/$defs/inFlight"
                hold:
                  oneOf:
                    - type: "null"
                    - $ref: "#/$defs/hold"
                notices:
                  type: integer
                  minimum: 0
                questions:
                  type: array
                  maxItems: 10
                  items:
                    $ref: "#/$defs/question"
              required:
                - v
                - handled
                - floor
                - checkFix
                - inFlight
                - hold
              additionalProperties: false
            inFlight:
              type: object
              properties:
                requestId:
                  type: string
                runUlid:
                  type: string
                itemIds:
                  type: array
                  items:
                    type: string
                headSha:
                  type: string
                checkFix:
                  type: boolean
                failureReported:
                  type: boolean
                dispatchedAt:
                  type: string
                sessionProgress:
                  type: object
                  properties:
                    cursor:
                      type: integer
                      minimum: 0
                    promptSeq:
                      type:
                        - integer
                        - "null"
                      minimum: 0
                    startSeq:
                      type:
                        - integer
                        - "null"
                      minimum: 0
                    finalSeq:
                      type:
                        - integer
                        - "null"
                      minimum: 0
                    finalText:
                      type: string
                      maxLength: 8192
                    terminalStatus:
                      enum:
                        - pending
                        - completed
                        - failed
                  required:
                    - cursor
                    - promptSeq
                    - startSeq
                    - finalSeq
                    - finalText
                  additionalProperties: false
                questions:
                  type: array
                  maxItems: 10
                  items:
                    $ref: "#/$defs/question"
                coordination:
                  type: object
                  properties:
                    phase:
                      enum:
                        - implementing
                        - reviewing
                        - publishing
                        - published
                        - blocked
                    stageAt:
                      type: string
                    pass:
                      type: integer
                      minimum: 1
                      maximum: 3
                    reviewId:
                      type: string
                    reviewers:
                      type: array
                      minItems: 1
                      maxItems: 50
                      items:
                        type: object
                        properties:
                          sessionUlid:
                            type: string
                          assignmentId:
                            type: string
                          reviewerHandle:
                            type: string
                        required:
                          - sessionUlid
                          - assignmentId
                          - reviewerHandle
                        additionalProperties: false
                    snapshot:
                      type: object
                    result:
                      type: object
                      properties:
                        status:
                          enum:
                            - implemented
                            - blocked
                        replies:
                          type: array
                          maxItems: 50
                          items:
                            type: object
                            properties:
                              itemId:
                                type: string
                              body:
                                type: string
                              target:
                                type: string
                            required:
                              - itemId
                              - body
                            additionalProperties: false
                      required:
                        - status
                        - replies
                      additionalProperties: false
                  required:
                    - phase
                    - stageAt
                    - pass
                    - reviewId
                    - reviewers
                  additionalProperties: false
              required:
                - requestId
                - itemIds
                - headSha
                - checkFix
                - failureReported
              additionalProperties: false
            hold:
              type: object
              properties:
                reason:
                  type: string
                sinceHeadSha:
                  type: string
                since:
                  type: string
              required:
                - reason
                - sinceHeadSha
              additionalProperties: false
            question:
              type: object
              properties:
                body:
                  type: string
                  minLength: 1
                  maxLength: 1000
                  pattern: \S
                url:
                  type: string
                  pattern: "^https://[^\\s]+$"
                  maxLength: 2048
                createdAt:
                  type: string
                headSha:
                  type: string
                  pattern: "^[0-9a-f]{40}$"
                itemIds:
                  type: array
                  maxItems: 50
                  items:
                    type: string
                    pattern: "^(ic|rv|rc):(0|[1-9][0-9]{0,19})$"
                answerAuthors:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: string
                    minLength: 1
                    maxLength: 100
                    pattern: \S
                checkFix:
                  type: boolean
                threadRootId:
                  type: string
                  pattern: "^rc:(0|[1-9][0-9]{0,19})$"
              required:
                - body
                - url
                - createdAt
                - headSha
                - itemIds
                - answerAuthors
                - checkFix
              additionalProperties: false
      inputs:
        owner: "${workflow.inputs.owner}"
        repo: "${workflow.inputs.repo}"
        number: "${workflow.inputs.prNumber}"
        state: "${workflow.inputs.state}"
        roundStatus: "${workflow.inputs.roundStatus}"
        freshRequestId: "${steps.request_id.outputs.ulid}"
        hasActive: "${workflow.inputs.hasActive}"
      outputs:
        decision: $.normalized.data.decision
        cancelRound: $.normalized.data.cancelRound
        prOutcome: $.normalized.data.prOutcome
        nextState: $.normalized.data.nextState
        notice: $.normalized.data.notice
        noticeTarget: $.normalized.data.noticeTarget
        requestId: $.normalized.data.requestId
      onFailure:
        action: fail
      needs:
        - request_id
