<text x="110.0" y="122.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5f6f80" text-anchor="middle">reviewed and committed</text>
<rect x="235" y="84" width="140" height="50" rx="8" fill="#fff6e3" stroke="#e0b25a" stroke-width="1.25"/>
<text x="305.0" y="106.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#7a4a00" text-anchor="middle">Human approval</text>
<text x="305.0" y="122.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5f6f80" text-anchor="middle">publish the pull request</text>
