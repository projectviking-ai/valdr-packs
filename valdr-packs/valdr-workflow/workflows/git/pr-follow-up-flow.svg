<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-labelledby="flow-title flow-desc">
<title id="flow-title">Pull request follow-up</title>
<desc id="flow-desc">A delivered task is published as a pull request after human approval. A watch then installs one automation for that pull request, and the automation runs a short check every interval until the pull request is merged or closed. Each check observes the saved state and the session list, decides from a snapshot of the pull request, settles progress, and, advances the saved batch through implementation, review, and publication. The original implementation session fixes and tests the change. The workflow asks the existing reviewer sessions for fresh reviews, then commits, pushes and posts one reply per feedback item. A failure posts one notice and holds until the next comment. A merged or closed pull request marks the task done and removes the watch.</desc>
<defs><marker id="a-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L9,5 L1,8.5 Z" fill="#334155"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L9,5 L1,8.5 Z" fill="#2f7d57"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L9,5 L1,8.5 Z" fill="#b26a00"/></marker></defs>
<rect width="1000" height="640" fill="#ffffff"/>
<text x="40" y="42" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1f2933" text-anchor="start">Pull request follow-up</text>
<text x="40" y="62" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5f6f80" text-anchor="start">One automation per pull request. Each check is short; the original implementation session and its reviewers do the work.</text>
