<text x="40" y="608" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f6f80" text-anchor="start">The workflow coordinates original sessions, observes their progress on later checks, and publishes only the approved changes and validated replies.</text>
