schemaVersion: 1
workflow:
  key: valdr-workflow.pull-request.observe
  name: Observe Pull Request Work
  description: Read the checkpoint and existing session summaries for best-effort PR follow-up. No transcript or dispatch history is read.
  version: 0.1.5
  pack: valdr-workflow
  source:
    kind: capability
    capabilityKey: valdr-workflow.workflow.pull-request-observe
  start:
    mode: manual
  inputs:
    automationKey:
      type: string
      required: true
    taskKey:
      type: string
      required: true
    implementationSessionUlid:
      type: string
      required: true
  outputs:
    activationId:
      type: string
      required: true
    roundStatus:
      type: string
      required: true
    activeSessionUlid:
      type: string
      required: true
    hasActive:
      type: string
      required: true
    stateVersion:
      type: integer
      required: true
    state:
      type: object
      required: true
  outputMappings:
    activationId: "${steps.rule.outputs.activationId}"
    stateVersion: "${steps.state.outputs.stateVersion}"
    state: "${steps.observe.outputs.state}"
    roundStatus: "${steps.observe.outputs.roundStatus}"
    activeSessionUlid: "${steps.observe.outputs.sessionUlid}"
    hasActive: "${steps.observe.outputs.hasActive}"
  steps:
    - key: rule
      name: Read the automation
      kind: tool
      tool:
        id: pm_automation
        action: get
      inputs:
        params:
          key: "${workflow.inputs.automationKey}"
      outputs:
        activationId: $.raw.activationId
      onFailure:
        action: fail
    - key: state
      name: Read the checkpoint
      kind: tool
      needs:
        - rule
      tool:
        id: pm_automation
        action: get_state
      inputs:
        params:
          key: "${workflow.inputs.automationKey}"
          expectedActivationId: "${steps.rule.outputs.activationId}"
      outputs:
        state: $.raw.state
        stateVersion: $.raw.stateVersion
      onFailure:
        action: fail
    - key: sessions
      name: Find existing delivery sessions
      kind: tool
      needs:
        - state
      tool:
        id: pm_session
        action: list
      inputs:
        contextRef: "TASK-${workflow.inputs.taskKey}"
        limit: 1000
      outputs:
        sessions: $.raw.sessions
      onFailure:
        action: fail
    - key: review
      name: review
      kind: tool
      tool:
        id: pm_review
        action: list
      inputs:
        taskKey: "${workflow.inputs.taskKey}"
      outputs:
        review: $.normalized.review
      onFailure:
        action: fail
      needs:
        - sessions
    - key: observe
      name: Observe existing session activity
      kind: tool
      needs:
        - state
        - sessions
        - review
      tool:
        id: valdr-workflow.user.pr-feedback
        action: observe
        revision: 1.2.1
        contentHash: sha256:a0bbaf0ae533ca632dd2b371977ac922b9d187bd12688ab9167bd4409e72e2a1
        inputSchema:
          type: object
          properties:
            state:
              $ref: "#/$defs/state"
            sessions:
              type: array
              maxItems: 1000
              items:
                type: object
            implementationSessionUlid:
              type: string
            taskKey:
              type: string
            review:
              type: object
          required:
            - state
            - sessions
            - implementationSessionUlid
            - taskKey
          additionalProperties: false
          $defs:
            state:
              type: object
              properties:
                v:
                  const: 1
                handled:
                  type: array
                  items:
                    type: string
                floor:
                  type:
                    - string
                    - "null"
                checkFix:
                  type: object
                  properties:
                    lastSha:
                      type:
                        - string
                        - "null"
                    attempts:
                      type: integer
                      minimum: 0
                  required:
                    - lastSha
                    - attempts
                  additionalProperties: false
                inFlight:
                  oneOf:
                    - type: "null"
                    - $ref: "#/$defs/inFlight"
                hold:
                  oneOf:
                    - type: "null"
                    - $ref: "#/$defs/hold"
                notices:
                  type: integer
                  minimum: 0
                questions:
                  type: array
                  maxItems: 10
                  items:
                    $ref: "#/$defs/question"
              required:
                - v
                - handled
                - floor
                - checkFix
                - inFlight
                - hold
              additionalProperties: false
            inFlight:
              type: object
              properties:
                requestId:
                  type: string
                runUlid:
                  type: string
                itemIds:
                  type: array
                  items:
                    type: string
                headSha:
                  type: string
                checkFix:
                  type: boolean
                failureReported:
                  type: boolean
                dispatchedAt:
                  type: string
                sessionProgress:
                  type: object
                  properties:
                    cursor:
                      type: integer
                      minimum: 0
                    promptSeq:
                      type:
                        - integer
                        - "null"
                      minimum: 0
                    startSeq:
                      type:
                        - integer
                        - "null"
                      minimum: 0
                    finalSeq:
                      type:
                        - integer
                        - "null"
                      minimum: 0
                    finalText:
                      type: string
                      maxLength: 8192
                    terminalStatus:
                      enum:
                        - pending
                        - completed
                        - failed
                  required:
                    - cursor
                    - promptSeq
                    - startSeq
                    - finalSeq
                    - finalText
                  additionalProperties: false
                questions:
                  type: array
                  maxItems: 10
                  items:
                    $ref: "#/$defs/question"
                coordination:
                  type: object
                  properties:
                    phase:
                      enum:
                        - implementing
                        - reviewing
                        - publishing
                        - published
                        - blocked
                    stageAt:
                      type: string
                    pass:
                      type: integer
                      minimum: 1
                      maximum: 3
                    reviewId:
                      type: string
                    reviewers:
                      type: array
                      minItems: 1
                      maxItems: 50
                      items:
                        type: object
                        properties:
                          sessionUlid:
                            type: string
                          assignmentId:
                            type: string
                          reviewerHandle:
                            type: string
                        required:
                          - sessionUlid
                          - assignmentId
                          - reviewerHandle
                        additionalProperties: false
                    snapshot:
                      type: object
                    result:
                      type: object
                      properties:
                        status:
                          enum:
                            - implemented
                            - blocked
                        replies:
                          type: array
                          maxItems: 50
                          items:
                            type: object
                            properties:
                              itemId:
                                type: string
                              body:
                                type: string
                              target:
                                type: string
                            required:
                              - itemId
                              - body
                            additionalProperties: false
                      required:
                        - status
                        - replies
                      additionalProperties: false
                  required:
                    - phase
                    - stageAt
                    - pass
                    - reviewId
                    - reviewers
                  additionalProperties: false
              required:
                - requestId
                - itemIds
                - headSha
                - checkFix
                - failureReported
              additionalProperties: false
            hold:
              type: object
              properties:
                reason:
                  type: string
                sinceHeadSha:
                  type: string
                since:
                  type: string
              required:
                - reason
                - sinceHeadSha
              additionalProperties: false
            question:
              type: object
              properties:
                body:
                  type: string
                  minLength: 1
                  maxLength: 1000
                  pattern: \S
                url:
                  type: string
                  pattern: "^https://[^\\s]+$"
                  maxLength: 2048
                createdAt:
                  type: string
                headSha:
                  type: string
                  pattern: "^[0-9a-f]{40}$"
                itemIds:
                  type: array
                  maxItems: 50
                  items:
                    type: string
                    pattern: "^(ic|rv|rc):(0|[1-9][0-9]{0,19})$"
                answerAuthors:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: string
                    minLength: 1
                    maxLength: 100
                    pattern: \S
                checkFix:
                  type: boolean
                threadRootId:
                  type: string
                  pattern: "^rc:(0|[1-9][0-9]{0,19})$"
              required:
                - body
                - url
                - createdAt
                - headSha
                - itemIds
                - answerAuthors
                - checkFix
              additionalProperties: false
        outputSchema:
          type: object
          properties:
            state:
              $ref: "#/$defs/state"
            roundStatus:
              enum:
                - ""
                - pending
                - running
                - completed
                - failed
                - ready_review
                - ready_revise
                - ready_publish
            sessionUlid:
              type: string
            hasActive:
              enum:
                - "yes"
                - "no"
          required:
            - state
            - roundStatus
            - sessionUlid
            - hasActive
          additionalProperties: false
          $defs:
            state:
              type: object
              properties:
                v:
                  const: 1
                handled:
                  type: array
                  items:
                    type: string
                floor:
                  type:
                    - string
                    - "null"
                checkFix:
                  type: object
                  properties:
                    lastSha:
                      type:
                        - string
                        - "null"
                    attempts:
                      type: integer
                      minimum: 0
                  required:
                    - lastSha
                    - attempts
                  additionalProperties: false
                inFlight:
                  oneOf:
                    - type: "null"
                    - $ref: "#/$defs/inFlight"
                hold:
                  oneOf:
                    - type: "null"
                    - $ref: "#/$defs/hold"
                notices:
                  type: integer
                  minimum: 0
                questions:
                  type: array
                  maxItems: 10
                  items:
                    $ref: "#/$defs/question"
              required:
                - v
                - handled
                - floor
                - checkFix
                - inFlight
                - hold
              additionalProperties: false
            inFlight:
              type: object
              properties:
                requestId:
                  type: string
                runUlid:
                  type: string
                itemIds:
                  type: array
                  items:
                    type: string
                headSha:
                  type: string
                checkFix:
                  type: boolean
                failureReported:
                  type: boolean
                dispatchedAt:
                  type: string
                sessionProgress:
                  type: object
                  properties:
                    cursor:
                      type: integer
                      minimum: 0
                    promptSeq:
                      type:
                        - integer
                        - "null"
                      minimum: 0
                    startSeq:
                      type:
                        - integer
                        - "null"
                      minimum: 0
                    finalSeq:
                      type:
                        - integer
                        - "null"
                      minimum: 0
                    finalText:
                      type: string
                      maxLength: 8192
                    terminalStatus:
                      enum:
                        - pending
                        - completed
                        - failed
                  required:
                    - cursor
                    - promptSeq
                    - startSeq
                    - finalSeq
                    - finalText
                  additionalProperties: false
                questions:
                  type: array
                  maxItems: 10
                  items:
                    $ref: "#/$defs/question"
                coordination:
                  type: object
                  properties:
                    phase:
                      enum:
                        - implementing
                        - reviewing
                        - publishing
                        - published
                        - blocked
                    stageAt:
                      type: string
                    pass:
                      type: integer
                      minimum: 1
                      maximum: 3
                    reviewId:
                      type: string
                    reviewers:
                      type: array
                      minItems: 1
                      maxItems: 50
                      items:
                        type: object
                        properties:
                          sessionUlid:
                            type: string
                          assignmentId:
                            type: string
                          reviewerHandle:
                            type: string
                        required:
                          - sessionUlid
                          - assignmentId
                          - reviewerHandle
                        additionalProperties: false
                    snapshot:
                      type: object
                    result:
                      type: object
                      properties:
                        status:
                          enum:
                            - implemented
                            - blocked
                        replies:
                          type: array
                          maxItems: 50
                          items:
                            type: object
                            properties:
                              itemId:
                                type: string
                              body:
                                type: string
                              target:
                                type: string
                            required:
                              - itemId
                              - body
                            additionalProperties: false
                      required:
                        - status
                        - replies
                      additionalProperties: false
                  required:
                    - phase
                    - stageAt
                    - pass
                    - reviewId
                    - reviewers
                  additionalProperties: false
              required:
                - requestId
                - itemIds
                - headSha
                - checkFix
                - failureReported
              additionalProperties: false
            hold:
              type: object
              properties:
                reason:
                  type: string
                sinceHeadSha:
                  type: string
                since:
                  type: string
              required:
                - reason
                - sinceHeadSha
              additionalProperties: false
            question:
              type: object
              properties:
                body:
                  type: string
                  minLength: 1
                  maxLength: 1000
                  pattern: \S
                url:
                  type: string
                  pattern: "^https://[^\\s]+$"
                  maxLength: 2048
                createdAt:
                  type: string
                headSha:
                  type: string
                  pattern: "^[0-9a-f]{40}$"
                itemIds:
                  type: array
                  maxItems: 50
                  items:
                    type: string
                    pattern: "^(ic|rv|rc):(0|[1-9][0-9]{0,19})$"
                answerAuthors:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: string
                    minLength: 1
                    maxLength: 100
                    pattern: \S
                checkFix:
                  type: boolean
                threadRootId:
                  type: string
                  pattern: "^rc:(0|[1-9][0-9]{0,19})$"
              required:
                - body
                - url
                - createdAt
                - headSha
                - itemIds
                - answerAuthors
                - checkFix
              additionalProperties: false
      inputs:
        state: "${steps.state.outputs.state}"
        sessions: "${steps.sessions.outputs.sessions}"
        implementationSessionUlid: "${workflow.inputs.implementationSessionUlid}"
        taskKey: "${workflow.inputs.taskKey}"
        review: "${steps.review.outputs.review}"
      outputs:
        state: $.normalized.data.state
        roundStatus: $.normalized.data.roundStatus
        sessionUlid: $.normalized.data.sessionUlid
        hasActive: $.normalized.data.hasActive
      onFailure:
        action: fail
