schemaVersion: 1
pack: valdr-workflow
name: Valdr Workflow Pack
version: 0.14.11
description: "Workflow-owned agents, definitions, and user tools for task readiness, delivery, planning, pull-request follow-up, and idea-to-sprint orchestration."
license: MIT
homepage: https://valdr.ai
repository: https://github.com/projectviking-ai/valdr-packs
includes:
  - path: base
    description: Shared behavioural rules bound by every workflow-owned agent.
  - path: agents
    description: Workflow-owned agents launched by workflow definitions.
  - path: orchestrator
    description: Workflow orchestrator agents that author, run, and debug workflow definitions.
  - path: reference
    description: Shared workflow tool selection and detailed execution contracts.
  - path: workflows
    description: Workflow definitions for task readiness and delivery review.
  - path: planning-team
    description: Independent specification and planning team with orchestrator-owned acceptance.
  - path: tools
    description: Workflow-owned user tools.
