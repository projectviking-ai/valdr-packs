  - id: reply
    path:
      - pull-request
      - reply
    name: Reply
    description: "Post automation replies to feedback items: a threaded reply on the thread root for an inline review comment (GitHub rejects replies to replies), otherwise a conversation comment that quotes the item. The marker names the item itself. Only markers written by the authenticated account count, so an item that already has its own marked reply is not posted again, and a deleted item is reported as missing. An empty list is a no-op that does not call GitHub. Re-running after an interruption is safe because replies are reconciled by marker. A body that contains an automation marker, a local absolute path or a ULID-shaped token is rejected. When allowedItemIds is given, a reply to any other item fails the whole call before GitHub is contacted. An optional stable target distinguishes separate replies to the same item; reuse it after a lost response."
    inputSchema:
      type: object
      properties:
        owner:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{0,38}$"
        repo:
          type: string
          pattern: "^[A-Za-z0-9._-]{1,100}$"
        number:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        replies:
          type: array
          maxItems: 50
          items:
            type: object
            properties:
              itemId:
                type: string
                pattern: "^(ic|rv|rc):(0|[1-9][0-9]{0,19})$"
              body:
                type: string
                minLength: 1
                maxLength: 30000
                pattern: \S
                not:
                  pattern: "<!-- valdr-automation:v1|(^|[\\s\"'`(\\[<=:*_|~]|file://)(/Users/|/home/|/private/var/|/private/tmp/|C:\\\\Users\\\\)|\\b[0-7][0-9A-HJKMNP-TV-Z]{25}\\b"
              target:
                type: string
                pattern: "^(ic|rv|rc|pr|notice):(0|[1-9][0-9]{0,19})$"
            required:
