      type: object
      properties:
        owner:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{0,38}$"
        repo:
          type: string
          pattern: "^[A-Za-z0-9._-]{1,100}$"
        number:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        itemIds:
          type: array
          maxItems: 50
          items:
            type: string
            pattern: "^(ic|rv|rc):(0|[1-9][0-9]{0,19})$"
        headSha:
          type: string
          pattern: "^[0-9a-f]{40}$"
        state:
          $ref: "#/$defs/state"
      required:
        - owner
        - repo
        - number
        - itemIds
        - headSha
