  - id: collect
    path:
      - pull-request
      - collect
    name: Collect
    description: "Read the content of one round: the requested feedback items, in the requested order (items that no longer exist or no longer qualify are absent), and the failing checks for the given head. A body over 4000 characters is cut, with a link to the full text; at most ten failing checks are returned, the first three Actions jobs with a log excerpt of at most 8192 bytes. An empty itemIds list skips the feedback read. A closed pull request can still be read. Optional checkpoint state supplies the published questions answered by this batch. Collected bodies omit hidden comments and control characters; location and thread fields remain available."
