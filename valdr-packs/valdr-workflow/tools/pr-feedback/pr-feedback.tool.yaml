schemaVersion: 1
id: valdr-workflow.user.pr-feedback
revision: 1.2.1
icon: code-bracket-square
name: PR Feedback
description: "Watch a GitHub pull request for owner, member and collaborator feedback and failing checks, decide the next follow-up step, and post marked automation replies. Requires the host-installed gh CLI with authentication."
files:
  - path: runner.mjs
  - path: contract.mjs
  - path: feedback.mjs
  - path: github.mjs
  - path: session.mjs
  - path: coordination.mjs
  - path: publish.mjs
process:
  executable: node
  args:
    - runner.mjs
  inheritEnv:
    - GH_TOKEN
    - GITHUB_TOKEN
    - GH_ENTERPRISE_TOKEN
    - GITHUB_ENTERPRISE_TOKEN
    - GH_HOST
    - GH_CONFIG_DIR
limits:
  timeoutSeconds: 60
  maxInputBytes: 1048576
  maxResultBytes: 1048576
  maxLogBytes: 4096
actions:
  - id: identify
    path:
      - pull-request
      - identify
    name: Identify
    description: "Confirm a pull request is open and on the expected head branch of the base repository, and return its normalized automation key and resource key. A pull request from a fork is a mismatch, because its head branch cannot be pushed to."
    inputSchema:
      type: object
      properties:
        owner:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{0,38}$"
        repo:
          type: string
          pattern: "^[A-Za-z0-9._-]{1,100}$"
        number:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        headBranch:
          type: string
          minLength: 1
          maxLength: 255
          pattern: \S
      required:
        - owner
        - repo
        - number
        - headBranch
      additionalProperties: false
    outputSchema:
      type: object
      properties:
        outcome:
          enum:
            - watchable
            - not_open
            - mismatch
        owner:
          type: string
        repo:
          type: string
        automationKey:
          type: string
          maxLength: 200
        resourceKey:
          type: string
        prState:
          enum:
            - open
            - closed
      required:
        - outcome
        - owner
        - repo
        - automationKey
        - resourceKey
        - prState
      additionalProperties: false
    execution: supported
    sideEffects: read
    retry: idempotent
  - id: snapshot
    path:
      - pull-request
      - snapshot
    name: Snapshot
    description: "Read the pull request, its qualifying feedback and its check runs, then decide the next step. Returns the decision, the next checkpoint state and a count of qualifying items, never feedback or check content: a dispatched round reads its own content with collect. A round still active more than 8 hours after it was dispatched is reported as stalled, with cancelRound yes. A closed pull request is reported without reading feedback or checks. An absent or empty roundStatus means no round. Optional state.questions holds caller-recorded published questions and allowed answer authors. An unanswered CI question pauses retries only for its recorded head. Merge evidence does not authorize downstream completion."
    inputSchema:
      type: object
      properties:
        owner:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{0,38}$"
        repo:
          type: string
          pattern: "^[A-Za-z0-9._-]{1,100}$"
        number:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        state:
          $ref: "#/$defs/state"
        roundStatus:
          enum:
            - ""
            - pending
            - running
            - waiting
            - blocked
            - failed
            - completed
            - cancelled
            - ready_review
            - ready_revise
            - ready_publish
        freshRequestId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: \S
        hasActive:
          enum:
            - "yes"
            - "no"
      required:
        - owner
        - repo
        - number
        - state
        - freshRequestId
      additionalProperties: false
      $defs:
        state:
          type: object
          properties:
            v:
              const: 1
            handled:
              type: array
              items:
                type: string
            floor:
              type:
                - string
                - "null"
            checkFix:
              type: object
              properties:
                lastSha:
                  type:
                    - string
                    - "null"
                attempts:
                  type: integer
                  minimum: 0
              required:
                - lastSha
                - attempts
              additionalProperties: false
            inFlight:
              oneOf:
                - type: "null"
                - $ref: "#/$defs/inFlight"
            hold:
              oneOf:
                - type: "null"
                - $ref: "#/$defs/hold"
            notices:
              type: integer
              minimum: 0
            questions:
              type: array
              maxItems: 10
              items:
                $ref: "#/$defs/question"
          required:
            - v
            - handled
            - floor
            - checkFix
            - inFlight
            - hold
          additionalProperties: false
        inFlight:
          type: object
          properties:
            requestId:
              type: string
            runUlid:
              type: string
            itemIds:
              type: array
              items:
                type: string
            headSha:
              type: string
            checkFix:
              type: boolean
            failureReported:
              type: boolean
            dispatchedAt:
              type: string
            sessionProgress:
              type: object
              properties:
                cursor:
                  type: integer
                  minimum: 0
                promptSeq:
                  type:
                    - integer
                    - "null"
                  minimum: 0
                startSeq:
                  type:
                    - integer
                    - "null"
                  minimum: 0
                finalSeq:
                  type:
                    - integer
                    - "null"
                  minimum: 0
                finalText:
                  type: string
                  maxLength: 8192
                terminalStatus:
                  enum:
                    - pending
                    - completed
                    - failed
              required:
                - cursor
                - promptSeq
                - startSeq
                - finalSeq
                - finalText
              additionalProperties: false
            questions:
              type: array
              maxItems: 10
              items:
                $ref: "#/$defs/question"
            coordination:
              type: object
              properties:
                phase:
                  enum:
                    - implementing
                    - reviewing
                    - publishing
                    - published
                    - blocked
                stageAt:
                  type: string
                pass:
                  type: integer
                  minimum: 1
                  maximum: 3
                reviewId:
                  type: string
                reviewers:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    properties:
                      sessionUlid:
                        type: string
                      assignmentId:
                        type: string
                      reviewerHandle:
                        type: string
                    required:
                      - sessionUlid
                      - assignmentId
                      - reviewerHandle
                    additionalProperties: false
                snapshot:
                  type: object
                result:
                  type: object
                  properties:
                    status:
                      enum:
                        - implemented
                        - blocked
                    replies:
                      type: array
                      maxItems: 50
                      items:
                        type: object
                        properties:
                          itemId:
                            type: string
                          body:
                            type: string
                          target:
                            type: string
                        required:
                          - itemId
                          - body
                        additionalProperties: false
                  required:
                    - status
                    - replies
                  additionalProperties: false
              required:
                - phase
                - stageAt
                - pass
                - reviewId
                - reviewers
              additionalProperties: false
          required:
            - requestId
            - itemIds
            - headSha
            - checkFix
            - failureReported
          additionalProperties: false
        hold:
          type: object
          properties:
            reason:
              type: string
            sinceHeadSha:
              type: string
            since:
              type: string
          required:
            - reason
            - sinceHeadSha
          additionalProperties: false
        question:
          type: object
          properties:
            body:
              type: string
              minLength: 1
              maxLength: 1000
              pattern: \S
            url:
              type: string
              pattern: "^https://[^\\s]+$"
              maxLength: 2048
            createdAt:
              type: string
            headSha:
              type: string
              pattern: "^[0-9a-f]{40}$"
            itemIds:
              type: array
              maxItems: 50
              items:
                type: string
                pattern: "^(ic|rv|rc):(0|[1-9][0-9]{0,19})$"
            answerAuthors:
              type: array
              minItems: 1
              maxItems: 20
              items:
                type: string
                minLength: 1
                maxLength: 100
                pattern: \S
            checkFix:
              type: boolean
            threadRootId:
              type: string
              pattern: "^rc:(0|[1-9][0-9]{0,19})$"
          required:
            - body
            - url
            - createdAt
            - headSha
            - itemIds
            - answerAuthors
            - checkFix
          additionalProperties: false
    outputSchema:
      type: object
      properties:
        decision:
          type: string
          enum:
            - idle
            - closed
            - complete
            - save
            - report_failure
            - dispatch
            - review
            - revise
            - publish
        cancelRound:
          type: string
          enum:
