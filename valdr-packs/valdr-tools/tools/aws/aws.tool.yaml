    name: dynamodb list-tables
    description: List the first bounded page of table names.
    inputSchema:
      type: object
      properties:
        limit:
          *limit
        profile:
          *profile
        region:
          type: string
          minLength: 1
          maxLength: 256
          pattern: "^[a-z][a-z0-9-]*$"
      required:
        []
      additionalProperties: false
    outputSchema: true
    execution: supported
    sideEffects: read
    retry: idempotent
  - id: ecr-describe-repositories
    path:
      - ecr
      - describe-repositories
    name: ecr describe-repositories
    description: List the first bounded page of container repositories.
    inputSchema:
      type: object
      properties:
        limit:
          *limit
        profile:
